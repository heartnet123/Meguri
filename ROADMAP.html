function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function assertRoadmap() {
  const ids = ROADMAP.features.map((feature) => feature.id);
  const branches = ROADMAP.features.map((feature) => feature.branch);
  const counts = ROADMAP.features.reduce((result, feature) => {
    result[feature.priority] = (result[feature.priority] || 0) + 1;
    return result;
  }, {});
  if (ROADMAP.phases.length !== ROADMAP.phaseCount) throw new Error("Roadmap phase count mismatch");
  if (ROADMAP.features.length !== ROADMAP.featureCount) throw new Error("Roadmap feature count mismatch");
  if (new Set(ids).size !== ids.length) throw new Error("Roadmap feature IDs must be unique");
  if (branches.some((branch) => !branch || branch.trim() !== branch)) throw new Error("Every feature needs one exact branch");
  for (const [priority, count] of Object.entries(ROADMAP.priorityBreakdown)) {
    if ((counts[priority] || 0) !== count) throw new Error(`Priority count mismatch: ${priority}`);
  }
  if (ROADMAP.features.some((feature) => !ROADMAP.phases.some((phase) => phase.id === feature.sourcePhase))) {
    throw new Error("Feature references unknown source phase");
  }
}

function createInitialState() {
  return {
    columns: Object.fromEntries(
      ROADMAP.phases.map((phase) => [
        phase.id,
        ROADMAP.features.filter((feature) => feature.sourcePhase === phase.id).map((feature) => feature.id)
      ])
    )
  };
}

function isValidState(candidate) {
  if (!candidate || typeof candidate !== "object" || !candidate.columns || typeof candidate.columns !== "object") return false;
  const phaseIds = ROADMAP.phases.map((phase) => phase.id);
  if (Object.keys(candidate.columns).length !== phaseIds.length) return false;
  if (!phaseIds.every((phaseId) => Array.isArray(candidate.columns[phaseId]))) return false;
  const savedIds = phaseIds.flatMap((phaseId) => candidate.columns[phaseId]);
  const sourceIds = ROADMAP.features.map((feature) => feature.id);
  return savedIds.length === sourceIds.length && new Set(savedIds).size === sourceIds.length && sourceIds.every((id) => savedIds.includes(id));
}

function restoreState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (isValidState(saved)) return saved;
    localStorage.removeItem(STORAGE_KEY);
  } catch {
    try { localStorage.removeItem(STORAGE_KEY); } catch {}
  }
  return createInitialState();
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

function featureById(id) {
  return ROADMAP.features.find((feature) => feature.id === id);
}

function phaseById(id) {
  return ROADMAP.phases.find((phase) => phase.id === id);
}

function currentPhaseIdForFeature(id) {
  return ROADMAP.phases.find((phase) => state.columns[phase.id].includes(id))?.id || featureById(id).sourcePhase;
}

function badgeClass(kind, value) {
  const map = {
    priority: { Must: "border-rose-900/70 bg-rose-950/40 text-rose-300", Should: "border-amber-900/70 bg-amber-950/30 text-amber-300", Could: "border-sky-900/70 bg-sky-950/30 text-sky-300", Wont: "border-zinc-700 bg-zinc-900 text-zinc-500" },
    impact: { High: "border-emerald-900/70 bg-emerald-950/30 text-emerald-300", Medium: "border-cyan-900/70 bg-cyan-950/30 text-cyan-300", Low: "border-zinc-700 bg-zinc-900 text-zinc-400" },
    complexity: { High: "border-violet-900/70 bg-violet-950/30 text-violet-300", Medium: "border-indigo-900/70 bg-indigo-950/30 text-indigo-300", Low: "border-zinc-700 bg-zinc-900 text-zinc-400" }
  };
  return map[kind]?.[value] || "border-zinc-700 bg-zinc-900 text-zinc-400";
}

function renderMeta() {
  const priority = Object.entries(ROADMAP.priorityBreakdown)
    .map(([name, count]) => `${name} ${count}`)
    .join(" · ");
  const overall = Math.round(ROADMAP.features.reduce((sum, f) => sum + f.progress, 0) / ROADMAP.features.length);
  const mustFeatures = ROADMAP.features.filter((f) => f.priority === "Must");
  const mustProgress = Math.round(mustFeatures.reduce((sum, f) => sum + f.progress, 0) / mustFeatures.length);
  document.getElementById("projectName").textContent = ROADMAP.project;
  document.getElementById("projectVision").textContent = ROADMAP.vision;
  document.getElementById("metaBar").innerHTML = [
    ["Phases", ROADMAP.phaseCount],
    ["Features", ROADMAP.featureCount],
    ["Competitor analysis", ROADMAP.competitorAnalysisUsed],
    ["Competitor pain-point features", ROADMAP.competitorPainPointFeatures],
    ["Priority", priority],
    ["Overall progress", `${overall}%`],
    ["Must-have progress", `${mustProgress}%`],
    ["Last updated", ROADMAP.lastUpdated]
  ].map(([label, value]) => `<div class="flex items-center gap-1.5"><dt class="text-zinc-600">${escapeHtml(label)}</dt><dd class="font-medium text-zinc-300">${escapeHtml(value)}</dd></div>`).join("");
}

function renderPhaseImpact(impact) {
  return `
    <dl class="mt-3 space-y-1 border-t border-zinc-800/80 pt-3 text-xs">
      <div><dt class="inline text-zinc-600">Primary outcome · </dt><dd class="inline text-zinc-400">${escapeHtml(impact.primaryOutcome)}</dd></div>
      <div><dt class="inline text-zinc-600">Operational outcome · </dt><dd class="inline text-zinc-400">${escapeHtml(impact.operationalOutcome)}</dd></div>
      <div><dt class="inline text-zinc-600">Validation goal · </dt><dd class="inline text-zinc-400">${escapeHtml(impact.validationGoal)}</dd></div>
      <div><dt class="inline text-zinc-600">Exit signal · </dt><dd class="inline text-zinc-400">${escapeHtml(impact.exitSignal)}</dd></div>
    </dl>`;
}

function renderCard(feature) {
  return `
    <button type="button" draggable="true" data-card-id="${escapeHtml(feature.id)}" class="group block w-full cursor-grab border border-zinc-800 bg-zinc-950 px-3 py-3 text-left hover:border-zinc-700 hover:bg-zinc-900/70 focus:cursor-grabbing focus:outline-none focus:ring-1 focus:ring-zinc-500" style="border-radius:2px" aria-label="Open ${escapeHtml(feature.title)} details">
      <span class="flex items-start gap-2">
        <iconify-icon class="mt-0.5 shrink-0 text-zinc-700 group-hover:text-zinc-500" icon="solar:hamburger-menu-linear" width="14" height="14" style="stroke-width:1.5" aria-hidden="true"></iconify-icon>
        <span class="min-w-0 flex-1">
          <span class="block text-sm font-medium leading-5 text-zinc-200">${escapeHtml(feature.title)}</span>
          <span class="mt-1.5 block text-xs leading-5 text-zinc-500">${escapeHtml(feature.description)}</span>
        </span>
      </span>
      <span class="mt-3 flex flex-wrap gap-1.5">
        <span class="border px-1.5 py-0.5 text-xs font-medium ${badgeClass("priority", feature.priority)}" style="border-radius:2px">${escapeHtml(feature.priority)}</span>
        <span class="border px-1.5 py-0.5 text-xs ${badgeClass("complexity", feature.complexity)}" style="border-radius:2px">${escapeHtml(feature.complexity)} complexity</span>
        <span class="border px-1.5 py-0.5 text-xs ${badgeClass("impact", feature.impact)}" style="border-radius:2px">${escapeHtml(feature.impact)} impact</span>
      </span>
      <span class="mt-3 flex items-center gap-2" aria-label="Progress ${feature.progress} percent">
        <span class="h-1 flex-1 overflow-hidden bg-zinc-800" style="border-radius:2px"><span class="block h-1 bg-emerald-600" style="border-radius:2px;width:${feature.progress}%"></span></span>
        <span class="shrink-0 text-xs font-medium text-zinc-400">${feature.progress}%</span>
      </span>
      <span class="mt-3 flex items-center gap-1.5 border-t border-zinc-900 pt-2 text-xs text-zinc-600">
        <iconify-icon icon="solar:branching-paths-down-linear" width="13" height="13" style="stroke-width:1.5" aria-hidden="true"></iconify-icon>
        <span class="min-w-0 flex-1 truncate font-mono text-zinc-500">${escapeHtml(feature.branch)}</span>
        <span class="shrink-0 text-zinc-600">${escapeHtml(feature.status)}</span>
      </span>
    </button>`;
}

function renderBoard() {
  board.innerHTML = ROADMAP.phases.map((phase, index) => {
    const ids = state.columns[phase.id];
    return `
      <section class="min-w-0 border border-zinc-800/80 bg-zinc-900/25" style="border-radius:2px" aria-labelledby="phase-${index}">
        <header class="border-b border-zinc-800/80 p-3">
          <div class="flex items-start gap-3">
            <span class="mt-0.5 text-xs font-medium text-zinc-600">0${index + 1}</span>
            <div class="min-w-0 flex-1">
              <div class="flex items-start justify-between gap-3">
                <h2 id="phase-${index}" class="text-base font-semibold leading-5 text-zinc-100">${escapeHtml(phase.name)}</h2>
                <span data-count-for="${escapeHtml(phase.id)}" class="shrink-0 border border-zinc-700 bg-zinc-950 px-1.5 py-0.5 text-xs font-medium text-zinc-300" style="border-radius:2px">${ids.length}</span>
              </div>
              <p class="mt-2 text-xs leading-5 text-zinc-400">${escapeHtml(phase.purpose)}</p>
              <p class="mt-2 text-xs leading-5 text-zinc-600"><span class="font-medium text-zinc-500">Why now · </span>${escapeHtml(phase.why)}</p>
              <p class="mt-2 text-xs leading-5 text-zinc-500"><span class="font-medium text-zinc-400">Target · </span>${escapeHtml(phase.target)}</p>
              <div class="mt-3 border-t border-zinc-800/80 pt-3">
                <p class="text-xs font-medium uppercase tracking-wider text-zinc-600">Milestones</p>
                <ul class="mt-1.5 space-y-1.5 text-xs leading-5 text-zinc-500">${phase.milestones.map((milestone) => `<li class="flex gap-2"><span class="text-zinc-700">—</span><span>${escapeHtml(milestone)}</span></li>`).join("")}</ul>
              </div>
              ${renderPhaseImpact(phase.expectedImpact)}
            </div>
          </div>
        </header>
        <div data-dropzone="${escapeHtml(phase.id)}" class="min-h-32 space-y-2 border border-dashed border-zinc-900 p-2 transition-colors" aria-label="${escapeHtml(phase.name)} features">
          ${ids.map((id) => renderCard(featureById(id))).join("")}
        </div>
      </section>`;
  }).join("");
}

function resetDropZones() {
  board.querySelectorAll("[data-dropzone]").forEach((zone) => {
    zone.classList.remove("border-zinc-500", "bg-zinc-900/70");
    zone.classList.add("border-zinc-900");
  });
}

function captureDomState() {
  return {
    columns: Object.fromEntries(
      ROADMAP.phases.map((phase) => [
        phase.id,
        [...board.querySelector(`[data-dropzone="${phase.id}"]`).querySelectorAll("[data-card-id]")].map((card) => card.dataset.cardId)
      ])
    )
  };
}

function renderList(items) {
  return `<ul class="mt-2 space-y-2 text-xs leading-5 text-zinc-300">${items.map((item) => `<li class="flex gap-2"><span class="text-zinc-600">—</span><span>${escapeHtml(item)}</span></li>`).join("")}</ul>`;
}

function renderProgressList(items, emptyText) {
  return items.length ? renderList(items) : `<p class="mt-2 text-xs leading-5 text-zinc-600">${escapeHtml(emptyText)}</p>`;
}

function detailBlock(label, value) {
  return `<div><dt class="text-xs font-medium uppercase tracking-wider text-zinc-600">${escapeHtml(label)}</dt><dd class="mt-1 text-xs leading-5 text-zinc-300">${escapeHtml(value)}</dd></div>`;
}

function buildPrompt(feature, currentPhaseId) {
  const phase = phaseById(feature.sourcePhase);
  const currentPhase = phaseById(currentPhaseId);
  return [
    `Feature: ${feature.title}`,
    "",
    `Implementation objective: ${feature.description}`,
    "",
    `Full description: ${feature.description}`,
    `Problem solved: ${feature.problemSolved}`,
    `Beneficiaries: ${feature.whoBenefits}`,
    `Rationale: ${feature.rationale}`,
    "",
    `Priority: ${feature.priority}`,
    `Complexity: ${feature.complexity}`,
    `Impact: ${feature.impact}`,
    `Impact confidence: ${feature.impactConfidence}`,
    `Source phase: ${phase.name}`,
    `Current board phase: ${currentPhase.name}`,
    `Dependencies: ${feature.dependencies.join("; ")}`,
    `Exact Git branch: ${feature.branch}`,
    `Status: ${feature.status}`,
    "",
    "Expected Impact / Success Definition (ผลลัพธ์ที่ตรวจสอบได้)",
    `User impact: ${feature.expectedImpact.userImpact}`,
    `Business or product impact: ${feature.expectedImpact.businessProductImpact}`,
    `Technical or operational impact: ${feature.expectedImpact.technicalOperationalImpact}`,
    `Success signals:\n${feature.expectedImpact.successSignals.map((signal) => `- ${signal}`).join("\n")}`,
    `Time horizon: ${feature.expectedImpact.timeHorizon}`,
    "",
    `Acceptance Criteria:\n${feature.acceptanceCriteria.map((criterion) => `- ${criterion}`).join("\n")}`,
    "",
    `User Stories:\n${feature.userStories.map((story) => `- ${story}`).join("\n")}`,
    "",
    "Implement only this feature. Do not expand into unrelated scope.",
    "Verify every acceptance criterion before completion."
  ].join("\n");
}

function openModal(featureId, opener) {
  const feature = featureById(featureId);
  if (!feature) return;
  const currentPhaseId = currentPhaseIdForFeature(featureId);
  const sourcePhase = phaseById(feature.sourcePhase);
  const currentPhase = phaseById(currentPhaseId);
  lastFocusedCard = opener;
  previousBodyOverflow = document.body.style.overflow;
  document.body.style.overflow = "hidden";
  modalRoot.classList.remove("hidden");
  modalRoot.innerHTML = `
    <div data-modal-backdrop class="fixed inset-0 z-40 flex items-center justify-center bg-black/80 p-4">
      <section role="dialog" aria-modal="true" aria-labelledby="featureDialogTitle" class="flex max-h-[calc(100vh-2rem)] w-full max-w-4xl flex-col border border-zinc-700 bg-zinc-950" style="border-radius:2px">
        <header class="flex shrink-0 items-start gap-4 border-b border-zinc-800 px-4 py-3 sm:px-5">
          <div class="min-w-0 flex-1">
            <p class="text-xs font-medium uppercase tracking-wider text-zinc-600">Feature detail</p>
            <h2 id="featureDialogTitle" class="mt-1 text-xl font-semibold tracking-tight text-zinc-100">${escapeHtml(feature.title)}</h2>
          </div>
          <button type="button" data-modal-close class="inline-flex h-8 w-8 shrink-0 items-center justify-center border border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100 focus:outline-none focus:ring-1 focus:ring-zinc-500" style="border-radius:2px" aria-label="Close feature details">
            <iconify-icon icon="solar:close-circle-linear" width="18" height="18" style="stroke-width:1.5" aria-hidden="true"></iconify-icon>
          </button>
        </header>
        <div class="min-h-0 flex-1 overflow-y-auto px-4 py-4 sm:px-5 sm:py-5">
          <div class="grid gap-5 lg:grid-cols-[minmax(0,1fr)_16rem]">
            <div class="space-y-5">
              <section>
                <h3 class="text-xs font-medium uppercase tracking-wider text-zinc-600">Definition</h3>
                <dl class="mt-3 space-y-4">
                  ${detailBlock("Description", feature.description)}
                  ${detailBlock("Problem solved", feature.problemSolved)}
                  ${detailBlock("Who benefits", feature.whoBenefits)}
                  ${detailBlock("Rationale", feature.rationale)}
                </dl>
              </section>
              <section class="border-t border-zinc-800 pt-5">
                <h3 class="text-sm font-semibold text-zinc-100">Progress — ${feature.progress}%</h3>
                <div class="mt-2 h-1.5 w-full overflow-hidden bg-zinc-800" style="border-radius:2px"><div class="h-1.5 bg-emerald-600" style="border-radius:2px;width:${feature.progress}%"></div></div>
                <div class="mt-4 grid gap-4 sm:grid-cols-2">
                  <div><dt class="text-xs font-medium uppercase tracking-wider text-emerald-500">Done</dt>${renderProgressList(feature.done, "Nothing recorded yet.")}</div>
                  <div><dt class="text-xs font-medium uppercase tracking-wider text-amber-500">Remaining</dt>${renderProgressList(feature.remaining, feature.progress >= 100 ? "Nothing remaining — feature complete." : "Out of scope — no active work.")}</div>
                </div>
              </section>
              <section class="border-t border-zinc-800 pt-5">
                <h3 class="text-sm font-semibold text-zinc-100">Expected Impact / Success Definition (ผลลัพธ์ที่ตรวจสอบได้)</h3>
                <dl class="mt-3 space-y-4">
                  ${detailBlock("User impact", feature.expectedImpact.userImpact)}
                  ${detailBlock("Business or product impact", feature.expectedImpact.businessProductImpact)}
                  ${detailBlock("Technical or operational impact", feature.expectedImpact.technicalOperationalImpact)}
                  <div><dt class="text-xs font-medium uppercase tracking-wider text-zinc-600">Success signals</dt><dd>${renderList(feature.expectedImpact.successSignals)}</dd></div>
                  ${detailBlock("Time horizon", feature.expectedImpact.timeHorizon)}
                </dl>
              </section>
              <section class="border-t border-zinc-800 pt-5">
                <h3 class="text-sm font-semibold text-zinc-100">Acceptance Criteria</h3>
                ${renderList(feature.acceptanceCriteria)}
              </section>
              <section class="border-t border-zinc-800 pt-5">
                <h3 class="text-sm font-semibold text-zinc-100">User Stories</h3>
                ${renderList(feature.userStories)}
              </section>
            </div>
            <aside class="space-y-4 lg:border-l lg:border-zinc-800 lg:pl-5">
              <dl class="space-y-4">
                ${detailBlock("Source phase", sourcePhase.name)}
                ${detailBlock("Current board phase", currentPhase.name)}
                ${detailBlock("Priority", feature.priority)}
                ${detailBlock("Complexity", feature.complexity)}
                ${detailBlock("Impact", feature.impact)}
                ${detailBlock("Impact confidence", feature.impactConfidence)}
                ${detailBlock("Status", feature.status)}
                ${detailBlock("Progress", feature.progress + "%")}
                ${detailBlock("Exact branch strategy", feature.branch)}
                <div><dt class="text-xs font-medium uppercase tracking-wider text-zinc-600">Dependencies</dt><dd>${renderList(feature.dependencies)}</dd></div>
              </dl>
            </aside>
          </div>
        </div>
        <footer class="flex shrink-0 flex-wrap justify-end gap-2 border-t border-zinc-800 px-4 py-3 sm:px-5">
          <button type="button" data-copy-prompt="${escapeHtml(feature.id)}" class="inline-flex items-center gap-1.5 border border-zinc-700 bg-zinc-900 px-3 py-2 text-xs font-medium text-zinc-200 hover:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500" style="border-radius:2px">
            <iconify-icon icon="solar:copy-linear" width="14" height="14" style="stroke-width:1.5" aria-hidden="true"></iconify-icon><span>Copy Prompt</span>
          </button>
          <button type="button" data-copy-branch="${escapeHtml(feature.id)}" class="inline-flex items-center gap-1.5 border border-zinc-700 bg-zinc-900 px-3 py-2 text-xs font-medium text-zinc-200 hover:border-zinc-500 focus:outline-none focus:ring-1 focus:ring-zinc-500" style="border-radius:2px">
            <iconify-icon icon="solar:branching-paths-down-linear" width="14" height="14" style="stroke-width:1.5" aria-hidden="true"></iconify-icon><span>Copy Branch Name</span>
          </button>
        </footer>
      </section>
    </div>`;
  modalRoot.querySelector("[data-modal-close]").focus();
}

function closeModal() {
  if (modalRoot.classList.contains("hidden")) return;
  modalRoot.classList.add("hidden");
  modalRoot.innerHTML = "";
  document.body.style.overflow = previousBodyOverflow;
  if (lastFocusedCard?.isConnected) lastFocusedCard.focus();
  lastFocusedCard = null;
}

function copyText(value) {
  const area = document.createElement("textarea");
  area.value = value;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  area.style.top = "0";
  document.body.appendChild(area);
  try {
    area.focus();
    area.select();
    area.setSelectionRange(0, area.value.length);
    return document.execCommand("copy");
  } catch {
    return false;
  } finally {
    area.remove();
  }
}

function showToast(message) {
  toast.textContent = message;
  toast.classList.remove("hidden");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.add("hidden"), 1800);
}

function copyWithFeedback(button, value, successLabel) {
  const original = button.innerHTML;
  const success = copyText(value);
  button.querySelector("span").textContent = success ? successLabel : "Copy failed";
  showToast(success ? successLabel : "Copy failed. Select and copy manually.");
  setTimeout(() => { if (button.isConnected) button.innerHTML = original; }, 1600);
}

board.addEventListener("click", (event) => {
  const card = event.target.closest("[data-card-id]");
  if (!card || Date.now() < suppressClickUntil) return;
  openModal(card.dataset.cardId, card);
});

board.addEventListener("dragstart", (event) => {
  const card = event.target.closest("[data-card-id]");
  if (!card) return;
  draggedId = card.dataset.cardId;
  dropCompleted = false;
  suppressClickUntil = Date.now() + 350;
  event.dataTransfer.effectAllowed = "move";
  event.dataTransfer.setData("text/plain", draggedId);
  requestAnimationFrame(() => card.classList.add("opacity-30", "border-zinc-500"));
});

board.addEventListener("dragover", (event) => {
  const zone = event.target.closest("[data-dropzone]");
  const draggedCard = draggedId ? board.querySelector(`[data-card-id="${draggedId}"]`) : null;
  if (!zone || !draggedCard) return;
  event.preventDefault();
  event.dataTransfer.dropEffect = "move";
  resetDropZones();
  zone.classList.remove("border-zinc-900");
  zone.classList.add("border-zinc-500", "bg-zinc-900/70");
  const candidates = [...zone.querySelectorAll("[data-card-id]:not(.opacity-30)")];
  const next = candidates.find((candidate) => event.clientY < candidate.getBoundingClientRect().top + candidate.getBoundingClientRect().height / 2);
  if (next) zone.insertBefore(draggedCard, next);
  else zone.appendChild(draggedCard);
});

board.addEventListener("drop", (event) => {
  const zone = event.target.closest("[data-dropzone]");
  if (!zone || !draggedId) return;
  event.preventDefault();
  dropCompleted = true;
  state = captureDomState();
  saveState();
  draggedId = null;
  renderBoard();
});

board.addEventListener("dragend", () => {
  resetDropZones();
  if (!dropCompleted) renderBoard();
  draggedId = null;
  suppressClickUntil = Date.now() + 250;
});

modalRoot.addEventListener("click", (event) => {
  if (event.target.hasAttribute("data-modal-backdrop") || event.target.closest("[data-modal-close]")) {
    closeModal();
    return;
  }
  const promptButton = event.target.closest("[data-copy-prompt]");
  if (promptButton) {
    const feature = featureById(promptButton.dataset.copyPrompt);
    copyWithFeedback(promptButton, buildPrompt(feature, currentPhaseIdForFeature(feature.id)), "Prompt copied");
    return;
  }
  const branchButton = event.target.closest("[data-copy-branch]");
  if (branchButton) {
    const feature = featureById(branchButton.dataset.copyBranch);
    copyWithFeedback(branchButton, feature.branch, "Branch copied");
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && !modalRoot.classList.contains("hidden")) closeModal();
});

document.getElementById("resetBoard").addEventListener("click", () => {
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  state = createInitialState();
  renderBoard();
  showToast("Board reset to source roadmap");
});

assertRoadmap();
state = restoreState();
renderMeta();
renderBoard();
</script>
</body>
</html>
